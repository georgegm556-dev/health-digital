<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#147D6B">
<meta name="description" content="Health Digital: encuentra médicos, agenda citas y administra tu membresía.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Health Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna tipo app móvil (máx. 560px), encabezado fijo arriba, navegación inferior, hojas deslizables para detalle y reserva */
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --surface-2:#EBF1EF; --ink:#0F1F1B; --muted:#56675F; --line:#DAE4E0;
  --brand:#147D6B; --brand-ink:#0B5D50; --brand-soft:#E1F2EC; --on-brand:#FFFFFF;
  --blue:#2563EB; --blue-soft:#E6EEFD; --warn:#9A5B07; --warn-soft:#FDF1DC; --danger:#B42318; --danger-soft:#FDECEA;
  --shadow:0 1px 2px rgba(11,93,80,.06),0 8px 24px rgba(11,93,80,.07);
  --scrim:rgba(8,20,17,.45);
  --f-display:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-s:10px; --r-m:14px; --r-l:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1311; --surface:#111C19; --surface-2:#172521; --ink:#E4EEEA; --muted:#93A69F; --line:#22332E;
  --brand:#3DB89C; --brand-ink:#8EDFC9; --brand-soft:#12302A; --on-brand:#03140F;
  --blue:#7DA6FF; --blue-soft:#17233F; --warn:#F2B24B; --warn-soft:#33260F; --danger:#F97A6E; --danger-soft:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1311; --surface:#111C19; --surface-2:#172521; --ink:#E4EEEA; --muted:#93A69F; --line:#22332E;
  --brand:#3DB89C; --brand-ink:#8EDFC9; --brand-soft:#12302A; --on-brand:#03140F;
  --blue:#7DA6FF; --blue-soft:#17233F; --warn:#F2B24B; --warn-soft:#33260F; --danger:#F97A6E; --danger-soft:#3A1714;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem;line-height:1.2}
h2{font-size:1.2rem;line-height:1.25}
h3{font-size:1rem;line-height:1.3}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}

.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--brand-ink)}
.brand svg{width:30px;height:30px;flex:none}
.demo-pill{margin-left:auto;font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:500;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--brand)}
.nav button[aria-current="page"] .nav-ic{background:var(--brand-soft)}
.nav-ic{display:grid;place-items:center;width:46px;height:28px;border-radius:999px;position:relative}
.badge-dot{position:absolute;top:0;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:.65rem;font-weight:700;display:grid;place-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px}
.card.elev{box-shadow:var(--shadow);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid transparent;padding:11px 16px;font-weight:600;font-size:.95rem;min-height:44px}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-soft{background:var(--brand-soft);color:var(--brand-ink)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:7px 12px;font-size:.86rem;border-radius:10px}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;font-weight:600}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;min-height:44px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:38px}
.err{color:var(--danger);font-size:.85rem}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.86rem;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.filters select{font-size:.85rem;padding:8px 10px;min-height:40px}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.ok{background:var(--brand-soft);color:var(--brand-ink)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.tag svg{width:13px;height:13px}

.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trust div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.78rem;line-height:1.3;color:var(--muted)}
.trust svg{width:20px;height:20px;color:var(--brand)}
.trust b{color:var(--ink);font-weight:600;font-size:.82rem}

.avatar{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1rem;color:#fff}
.avatar.lg{width:72px;height:72px;border-radius:22px;font-size:1.4rem}
.avatar.sm{width:40px;height:40px;border-radius:12px;font-size:.85rem}
.doc{display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;width:100%}
.doc-top{display:flex;gap:12px;align-items:flex-start}
.doc-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.doc-name{display:flex;align-items:center;gap:5px;font-weight:700;font-size:1rem}
.doc-name svg{width:16px;height:16px;color:var(--blue);flex:none}
.doc-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.84rem;color:var(--muted)}
.doc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.price{font-weight:700;font-size:1rem}
.stars{color:#E2A100;font-weight:700}
.next{font-size:.82rem;color:var(--brand-ink);font-weight:600}

.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg{width:44px;height:44px;color:var(--brand)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:62px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.day b{font-family:var(--f-display);font-size:1.15rem}
.day span{font-size:.72rem;color:var(--muted);text-transform:capitalize}
.day small{font-size:.66rem;color:var(--brand-ink);font-weight:600}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.day[aria-pressed="true"] span,.day[aria-pressed="true"] small{color:var(--on-brand)}
.day:disabled{opacity:.45}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-weight:600;font-size:.9rem}
.slot[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.slot:disabled{background:var(--surface-2);color:var(--muted);text-decoration:line-through;opacity:.7;cursor:not-allowed}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right;min-width:0}

.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:1.05rem;flex:1;min-width:0}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.sheet-body{overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:flex;flex-direction:column;gap:16px}
.sheet-foot{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet-foot .grow{flex:1;min-width:0}

.cred{border-radius:20px;padding:18px;color:#EFFFFA;background:linear-gradient(135deg,#0B5D50 0%,#147D6B 55%,#1E8E7A 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px}
.cred::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(255,255,255,.07)}
.cred .label{color:rgba(239,255,250,.75)}
.cred-name{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.cred-grid{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.cred canvas{width:76px;height:76px;background:#fff;border-radius:10px;padding:6px;flex:none}
.meter{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:999px}

.plan{display:flex;flex-direction:column;gap:12px}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.plan li{display:flex;gap:8px;align-items:flex-start}
.plan li svg{width:16px;height:16px;color:var(--brand);flex:none;margin-top:3px}
.plan.current{border:2px solid var(--brand)}
.plan-price{font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.plan-price small{font-family:var(--f-body);font-size:.85rem;font-weight:500;color:var(--muted)}

.list{display:flex;flex-direction:column}
.list > *{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.list > *:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list svg.chev{width:18px;height:18px;color:var(--muted)}
.li-ic{width:36px;height:36px;border-radius:11px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.li-ic svg{width:18px;height:18px}

.cita{display:flex;flex-direction:column;gap:12px}
.cita-when{display:flex;gap:12px;align-items:center}
.cal{flex:none;width:54px;border-radius:12px;overflow:hidden;text-align:center;border:1px solid var(--line)}
.cal span{display:block;background:var(--brand);color:var(--on-brand);font-size:.68rem;font-weight:700;text-transform:uppercase;padding:2px 0}
.cal b{display:block;font-family:var(--f-display);font-size:1.3rem;padding:3px 0;background:var(--surface)}
.confirm-box{background:var(--danger-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

.toggle{position:relative;width:46px;height:28px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.toggle input:checked + span{background:var(--brand)}
.toggle input:checked + span::after{transform:translateX(18px)}
.toggle input:focus-visible + span{outline:2px solid var(--brand);outline-offset:2px}

.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--brand);width:18px;height:18px;flex:none}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt:has(input:disabled){opacity:.55;cursor:not-allowed}

.hero-ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0}
.hero-ok .ring{width:72px;height:72px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)}
.hero-ok svg{width:36px;height:36px}

.rate{display:flex;gap:6px}
.rate button{border:0;background:none;font-size:2rem;line-height:1;color:var(--line);padding:2px}
.rate button.on{color:#E2A100}
.review{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:0}

.agenda-day{display:flex;flex-direction:column;gap:8px}
.agenda-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.aslot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:1px;font-size:.8rem}
.aslot b{font-size:.92rem}
.aslot.res{background:var(--brand-soft);border-color:transparent;color:var(--brand-ink);cursor:default}
.aslot.blk{background:var(--surface-2);color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.4rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.splash{min-height:70vh;display:grid;place-items:center;text-align:center}
.splash svg{width:56px;height:56px}
.prose{display:flex;flex-direction:column;gap:10px;font-size:.92rem;max-width:65ch}
.prose h3{margin-top:6px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:12px;font-size:.86rem}
.note svg{width:18px;height:18px;color:var(--blue);flex:none;margin-top:2px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
@media (max-width:380px){.filters{grid-template-columns:1fr 1fr}.filters select:last-child{grid-column:1/-1}.slots{grid-template-columns:repeat(3,minmax(0,1fr))}.trust{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand" aria-label="Health Digital">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#147D6B"/><path d="M13 8h6v5h5v6h-5v5h-6v-5H8v-6h5z" fill="#fff"/><circle cx="23.5" cy="8.5" r="3" fill="#2563EB"/></svg>
        Health Digital
      </div>
      <span class="demo-pill" id="modePill">Versión demo</span>
    </div>
  </header>
  <main id="view" aria-live="polite">
    <div class="splash"><div class="stack" style="align-items:center">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#147D6B"/><path d="M13 8h6v5h5v6h-5v5h-6v-5H8v-6h5z" fill="#fff"/></svg>
      <p class="muted">Abriendo tu espacio seguro…</p>
    </div></div>
  </main>
</div>
<nav class="nav" id="nav" hidden aria-label="Secciones"><div class="nav-in" id="navIn"></div></nav>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
/* ============ Configuración ============
   Para conectar tu propia base de datos, pega aquí los datos de tu proyecto de Supabase
   (Project Settings → API). La "anon key" es pública por diseño: la seguridad la ponen
   las reglas RLS de supabase.sql. Si se dejan vacíos, la app guarda los datos en el dispositivo. */
const CONFIG = {
  SUPABASE_URL: 'https://kzajozfetwfmbxojgnol.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_U8jH8zCpqCzjLJyTf07H5A_smi6ifkF',
  DEMO: true
};

/* ============ Datos de ejemplo (directorio demo) ============ */
const DOCTORES = [

const hoy = ()=>ymd(new Date());
const fmtCorta = s=>{const d=parseYmd(s);return `${DIAS[d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`};
const fmtLarga = s=>{const d=parseYmd(s);return d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})};
const cap = t=>t.charAt(0).toUpperCase()+t.slice(1);
const fmtMes = iso=>{const d=new Date(iso);return `${d.getDate()} de ${MESES_L[d.getMonth()]} de ${d.getFullYear()}`};
const relDia = s=>{const t=hoy(); if(s===t) return 'Hoy'; const m=new Date(); m.setDate(m.getDate()+1); if(s===ymd(m)) return 'Mañana'; return fmtCorta(s)};
const minutos = h=>{const [H,M]=h.split(':').map(Number);return H*60+M};
const citaTime = c=>{const d=parseYmd(c.fecha);const [H,M]=c.hora.split(':').map(Number);d.setHours(H,M,0,0);return d.getTime()};

function proximosDias(n){const out=[];const d=new Date();for(let i=0;i<n;i++){out.push(ymd(d));d.setDate(d.getDate()+1)}return out}
function horasDe(doc,fecha){
  const d=parseYmd(fecha); if(!doc.dias.includes(d.getDay())) return [];
  if(fecha===hoy()){const now=new Date();const lim=now.getHours()*60+now.getMinutes()+60;return doc.horas.filter(h=>minutos(h)>lim)}
  return doc.horas;
}
function libre(doc,fecha,hora){return !S.ocupados.has(slotKey(doc.id,fecha,hora))}
function libresDe(doc,fecha){return horasDe(doc,fecha).filter(h=>libre(doc,fecha,h))}
function proxima(doc){for(const f of proximosDias(14)){const l=libresDe(doc,f);if(l.length) return {fecha:f,hora:l[0]}}return null}
function calif(docId){const r=S.resenas.filter(x=>x.doctorId===docId);if(!r.length) return null;return {prom:r.reduce((a,b)=>a+b.estrellas,0)/r.length,n:r.length}}

/* ============ Almacenamiento: nube (db) o local ============ */
const LS_KEY='hd-demo-v1';
function lsRead(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){return null}}
function lsWrite(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v))}catch(e){}}

function LocalStore(){
  const st = lsRead() || {perfil:null,citas:[],ocupados:{},resenas:[]};
  const subs={perfil:[],citas:[],ocupados:[],resenas:[]};
  const emit=k=>{lsWrite(st);const v=k==='ocupados'?Object.entries(st.ocupados).map(([id,d])=>({id,...d})):st[k];subs[k].forEach(f=>f(v))};
  const on=(k)=>cb=>{subs[k].push(cb);setTimeout(()=>emit(k),0)};
  return {
    modo:'local', uid:'local',
    onPerfil:on('perfil'), onCitas:on('citas'), onOcupados:on('ocupados'), onResenas:on('resenas'),
    async savePerfil(p){st.perfil=p;emit('perfil')},
    async addCita(c){const id=uid();st.citas.push({id,...c});emit('citas');return id},
    async updateCita(id,patch){st.citas=st.citas.map(c=>c.id===id?{...c,...patch}:c);emit('citas')},
    async claim(key,data){if(st.ocupados[key]) return false;st.ocupados[key]=data;emit('ocupados');return true},
    async release(key){delete st.ocupados[key];emit('ocupados')},
    async addResena(r){st.resenas.push({id:uid(),...r});emit('resenas')},
    async borrarTodo(){for(const c of st.citas){if(c.estado==='confirmada'&&citaTime(c)>Date.now()) delete st.ocupados[c.slot]}st.perfil=null;st.citas=[];emit('ocupados');emit('citas');emit('perfil')}
  };
}
function CloudStore(db,me){
  const base=db.doc(`data/users/${me}/perfil`);
  const citas=base.collection('citas');
  const ocup=db.collection('ocupados');
  const res=db.collection('resenas');
  const fail=e=>toast(e&&e.code==='quota_exceeded'?'Se alcanzó el límite de almacenamiento de la demo.':'No se pudo sincronizar. Revisa tu conexión.');
  return {
    modo:'nube', uid:me,
    onPerfil:cb=>base.onSnapshot(s=>cb(s.exists?s.data():null),fail),
    onCitas:cb=>citas.onSnapshot(q=>cb(q.docs.map(d=>({id:d.id,...d.data()}))),fail),
    onOcupados:cb=>ocup.onSnapshot(q=>cb(q.docs.map(d=>({id:d.id,...d.data()})).filter(d=>d.doctorId)),fail),
    onResenas:cb=>res.onSnapshot(q=>cb(q.docs.map(d=>({id:d.id,...d.data()}))),fail),
    savePerfil:p=>base.set(p),
    async addCita(c){const r=await citas.add(c);return r.id},
    updateCita:(id,patch)=>citas.doc(id).update(patch),
    async claim(key,data){
      const ref=ocup.doc(key);
      const l=await ref.acquire({holder:me,ttlMs:4000});
      if(!l.acquired) return false;
      const s=await ref.get();
      if(s.exists&&s.data()&&s.data().doctorId) return false;
      await ref.set(data); return true;
    },
    release:key=>ocup.doc(key).delete(),
    async addResena(r){await res.add(r)},
    async borrarTodo(){
      for(const c of S.citas){
        if(c.estado==='confirmada'&&citaTime(c)>Date.now()){try{await ocup.doc(c.slot).delete()}catch(e){}}
        try{await citas.doc(c.id).delete()}catch(e){}
      }
      await base.delete();
    }
  };
}

const toSnake = o=>{const r={};for(const k in o){if(o[k]===undefined)continue;r[k.replace(/[A-Z]/g,m=>'_'+m.toLowerCase())]=o[k]}return r};
const toCamel = o=>{const r={};for(const k in o){r[k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase())]=o[k]}return r};
function SupabaseStore(sb,user){
  const me=user.id; const L={perfil:[],citas:[],ocupados:[],resenas:[]};
  const chk=({data,error})=>{if(error) throw error; return data};
  const fail=()=>toast('No se pudo sincronizar. Revisa tu conexión.');
  const fetchers={
    perfil:async()=>{const d=chk(await sb.from('perfiles').select('*').eq('id',me).maybeSingle());if(!d) return null;const p=toCamel(d);delete p.id;return p},
    citas:async()=>chk(await sb.from('citas').select('*').eq('user_id',me)).map(toCamel),
    ocupados:async()=>chk(await sb.from('ocupados').select('id,doctor_id,fecha,hora,modalidad,tipo').gte('fecha',hoy())).map(toCamel),
    resenas:async()=>chk(await sb.from('resenas').select('id,doctor_id,cita_id,estrellas,texto,fecha')).map(toCamel)
  };
  const refetch=async k=>{try{const v=await fetchers[k]();L[k].forEach(f=>f(v))}catch(e){fail()}};
  const ch=sb.channel('hd-'+me)
    .on('postgres_changes',{event:'*',schema:'public',table:'ocupados'},()=>refetch('ocupados'))
    .on('postgres_changes',{event:'*',schema:'public',table:'resenas'},()=>refetch('resenas'))
    .on('postgres_changes',{event:'*',schema:'public',table:'citas',filter:'user_id=eq.'+me},()=>refetch('citas'))
    .on('postgres_changes',{event:'*',schema:'public',table:'perfiles',filter:'id=eq.'+me},()=>refetch('perfil'));
  const on=k=>cb=>{L[k].push(cb);refetch(k)};
  return {
    modo:'supabase', uid:me, email:user.email||'',
    go(){ch.subscribe()}, stop(){try{sb.removeChannel(ch)}catch(e){} for(const k in L) L[k]=[]},
    onPerfil:on('perfil'), onCitas:on('citas'), onOcupados:on('ocupados'), onResenas:on('resenas'),
    async savePerfil(p){chk(await sb.from('perfiles').upsert({id:me,...toSnake(p)}));await refetch('perfil')},
    async addCita(c){const d=chk(await sb.from('citas').insert(toSnake(c)).select('id').single());await refetch('citas');return d.id},
    async updateCita(id,patch){chk(await sb.from('citas').update(toSnake(patch)).eq('id',id));await refetch('citas')},
    async claim(key,data){const {error}=await sb.from('ocupados').insert({id:key,...toSnake(data)});
      if(error){if(error.code==='23505'||error.code==='42501') {await refetch('ocupados');return false} throw error}
      await refetch('ocupados');return true},
    async release(key){chk(await sb.from('ocupados').delete().eq('id',key));await refetch('ocupados')},
    async addResena(r){chk(await sb.from('resenas').insert(toSnake(r)));await refetch('resenas')},
    async borrarTodo(){

/* ============ Arranque ============ */
function loadScript(src){return new Promise((ok,ko)=>{const t=document.createElement('script');t.src=src;t.onload=ok;t.onerror=ko;document.head.appendChild(t)})}
async function bootSupabase(){
  try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js')}
  catch(e){$('#view').innerHTML='<div class="card empty"><h3>No se pudo conectar</h3><p class="muted small">Revisa tu conexión a internet y recarga la página.</p></div>';return}
  const sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  S.sb=sb;
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){S.auth={modo:'nueva'};showAuth();return}
    if(session&&!(S.auth&&S.auth.modo==='nueva')&&(!ST||ST.uid!==session.user.id)) start(SupabaseStore(sb,session.user));
    if(!session&&ev==='SIGNED_OUT'){if(ST&&ST.stop)ST.stop();ST=null;S.store=null;S.ready=false;S.perfil=undefined;closeSheet();S.auth={modo:'entrar'};showAuth()}
  });
  const {data:{session}}=await sb.auth.getSession();
  if(session&&!(S.auth&&S.auth.modo==='nueva')){if(!ST) start(SupabaseStore(sb,session.user))} else if(S.auth&&S.auth.modo==='nueva'){showAuth()} else {S.auth=S.auth||{modo:'entrar'};showAuth()}
}
async function boot(){
  if(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY) return bootSupabase();
  let decided=false;
  const startLocal=()=>{if(decided) return;decided=true;start(LocalStore())};
  const timer=setTimeout(startLocal,2500);
  try{
    const c=window.claude;
    if(!c||!c.use){clearTimeout(timer);startLocal();return}
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    S.userApi=user;
    let me=null, name='';
    if(user){try{const m=await user.me();me=m.id;name=m.name||''}catch(e){}}
    S.nombreSugerido=name;
    if(db&&me){clearTimeout(timer); decided=true; S.ready=false; start(CloudStore(db,me)); return}
    clearTimeout(timer); startLocal();
  }catch(e){clearTimeout(timer);startLocal()}
}
function start(store){
  if(ST&&ST.stop) ST.stop();
  ST=store; S.store=store; S.ready=false; S.perfil=undefined; S.citas=[]; S.tab='descubrir';
  const pill=$('#modePill');
  if(store.modo==='supabase'){pill.textContent='Demo';pill.hidden=!CONFIG.DEMO}
  else pill.textContent = store.modo==='nube' ? 'Demo · sincronizado' : 'Demo · en este dispositivo';
  let pending=4; const done=()=>{if(--pending===0){S.ready=true;render()}};
  let first={p:true,c:true,o:true,r:true};
  store.onPerfil(p=>{S.perfil=p; if(first.p){first.p=false;done()} else render()});
  store.onCitas(c=>{S.citas=c; if(first.c){first.c=false;done()} else render()});
  store.onOcupados(list=>{S.ocupados=new Map(list.map(o=>[o.id,o])); if(first.o){first.o=false;done()} else {render(true);refreshSheetSlots()}});
  store.onResenas(r=>{S.resenas=r; if(first.r){first.r=false;done()} else render(true)});
  if(store.go) store.go();
}

const AUTH_ERR = m=>/Invalid login/i.test(m)?'Correo o contraseña incorrectos.':/Email not confirmed/i.test(m)?'Confirma tu correo con el enlace que te enviamos antes de entrar.':/already registered/i.test(m)?'Ya existe una cuenta con ese correo. Inicia sesión.':/Password should be/i.test(m)?'La contraseña debe tener al menos 8 caracteres.':/rate limit/i.test(m)?'Demasiados intentos. Espera unos minutos.':'No se pudo completar. Revisa tus datos e inténtalo de nuevo.';
async function submitAuth(){
  const a=S.auth; const sb=S.sb; const mail=$('#a-mail')?.value.trim(); const pass=$('#a-pass')?.value||'';
  const fail=m=>{a.busy=false;a.err=m;a.email=mail;showAuth()};
  if(a.modo!=='nueva'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail||'')) return fail('Escribe un correo válido.');
  if(a.modo!=='olvide'&&pass.length<8) return fail('La contraseña debe tener al menos 8 caracteres.');
  a.busy=true;a.err='';a.email=mail;showAuth();
  const redirect=location.origin+location.pathname;
  try{
    if(a.modo==='entrar'){const {error}=await sb.auth.signInWithPassword({email:mail,password:pass});if(error) return fail(AUTH_ERR(error.message))}
    else if(a.modo==='crear'){const {data,error}=await sb.auth.signUp({email:mail,password:pass,options:{emailRedirectTo:redirect}});if(error) return fail(AUTH_ERR(error.message));
      if(!data.session){S.auth={modo:'enviado',msg:'Te enviamos un enlace a '+mail+' para confirmar tu cuenta. Ábrelo y vuelve a iniciar sesión.'};showAuth()}}
    else if(a.modo==='olvide'){const {error}=await sb.auth.resetPasswordForEmail(mail,{redirectTo:redirect});if(error) return fail(AUTH_ERR(error.message));S.auth={modo:'enviado',msg:'Si existe una cuenta con '+mail+', recibirás un enlace para cambiar tu contraseña.'};showAuth()}
    else if(a.modo==='nueva'){const {error}=await sb.auth.updateUser({password:pass});if(error) return fail(AUTH_ERR(error.message));S.auth={modo:'entrar'};toast('Contraseña actualizada.');const {data:{session}}=await sb.auth.getSession();if(session) start(SupabaseStore(sb,session.user))}
  }catch(e){fail('No se pudo conectar. Revisa tu internet.')}
}

function filtrarDoctores(){

function drawQR(){
  const cv=$('#qr'); if(!cv) return; const ctx=cv.getContext('2d'); const n=21, s=64/n;
  let h=0; for(const ch of (S.perfil.socio||'HD')) h=(h*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};
  ctx.fillStyle='#fff';ctx.fillRect(0,0,64,64);ctx.fillStyle='#0B1311';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);if(f)continue;if(rnd()>.52)ctx.fillRect(x*s,y*s,s,s)}
  const finder=(fx,fy)=>{ctx.fillRect(fx*s,fy*s,7*s,7*s);ctx.fillStyle='#fff';ctx.fillRect((fx+1)*s,(fy+1)*s,5*s,5*s);ctx.fillStyle='#0B1311';ctx.fillRect((fx+2)*s,(fy+2)*s,3*s,3*s)};
  finder(0,0);finder(14,0);finder(0,14);
}

  return sheetFrame('Mis seguros',`<p class="muted small">Elige tus aseguradoras y te mostraremos quién las acepta.</p>
    <div class="stack" style="gap:8px">${SEGUROS.map(x=>`<label class="opt"><input type="checkbox" name="seg" value="${esc(x)}" ${sel.has(x)?'checked':''}><b>${esc(x)}</b></label>`).join('')}</div>`,
    `<button class="btn btn-ghost grow" data-act="close">Cancelar</button><button class="btn btn-primary grow" data-act="guardarSeguros">Guardar</button>`);
}
function sheetNotif(){
  const n=S.perfil.notif||{recordatorios:true,promos:false};
  const t=(id,lbl,sub,on)=>`<div class="row between card"><div style="min-width:0"><b>${lbl}</b><p class="small muted">${sub}</p></div><label class="toggle"><input type="checkbox" id="${id}" ${on?'checked':''} aria-label="${lbl}"><span></span></label></div>`;
  return sheetFrame('Notificaciones',`${t('n-rec','Recordatorios de citas','24 h y 2 h antes de cada cita',n.recordatorios!==false)}${t('n-pro','Novedades y promociones','Descuentos en estudios y nuevos médicos',!!n.promos)}`,
    `<button class="btn btn-ghost grow" data-act="close">Cancelar</button><button class="btn btn-primary grow" data-act="guardarNotif">Guardar</button>`);
}
function sheetAviso(){
  return sheetFrame('Privacidad y seguridad',`<div class="prose">
    <div class="note">${I.info}<span>Borrador de ejemplo para la demo. Antes de lanzar, el aviso definitivo debe revisarlo un abogado conforme a la LFPDPPP.</span></div>
    <h3>Qué datos usamos</h3><p>Nombre, teléfono, correo, las citas que reservas y el motivo que escribas. Los datos de salud se consideran sensibles y solo se usan para tu atención.</p>
    <h3>Para qué</h3><p>Agendar y recordarte tus consultas, administrar tu membresía y compartir con tu médico lo necesario para atenderte. No vendemos tus datos ni los usamos para publicidad de terceros.</p>
    <h3>Quién los ve</h3><p>Tu perfil y tus citas son privados: solo tú los ves. El médico recibe únicamente el horario reservado, la modalidad y, en la versión final, tu nombre y motivo al confirmar.</p>
    <h3>Tus derechos (ARCO)</h3><p>Puedes acceder, rectificar, cancelar u oponerte al uso de tus datos. Desde Perfil puedes editar tu información o eliminarla por completo.</p>
    <h3>Opiniones</h3><p>Solo pueden opinar pacientes con una cita atendida, y su nombre no se muestra.</p>
  </div>`, `<button class="btn btn-primary btn-block" data-act="close">Entendido</button>`);
}
function sheetBorrar(){
  return sheetFrame('Eliminar mis datos',`<div class="confirm-box"><p><b>Se borrarán tu perfil, tu membresía y todas tus citas.</b></p><p class="small">Las citas próximas se cancelarán y sus horarios quedarán libres. Esta acción no se puede deshacer.</p></div>`,
    `<button class="btn btn-ghost grow" data-act="close">Conservar mis datos</button><button class="btn btn-danger grow" data-act="borrarSi">Eliminar todo</button>`);
}
function sheetOpinar(s){
  const c=S.citas.find(x=>x.id===s.citaId); const d=docById(c.doctorId);
  return sheetFrame('Califica tu consulta',`<div class="card elev row">${avatar(d,'sm')}<div><b>${esc(d.nombre)}</b><p class="small muted">${esc(fmtLarga(c.fecha))}</p></div></div>
    <div class="field"><span class="label">Tu calificación</span><div class="rate" role="group" aria-label="Estrellas">${[1,2,3,4,5].map(n=>`<button data-act="estrella" data-v="${n}" class="${n<=(s.estrellas||0)?'on':''}" aria-label="${n} estrellas">★</button>`).join('')}</div></div>
    <div class="field"><label for="r-txt">Cuéntanos tu experiencia <span class="muted">(opcional)</span></label><textarea class="input" id="r-txt" maxlength="400" placeholder="Puntualidad, trato, claridad de la explicación…">${esc(s.texto||'')}</textarea></div>
    <p class="small muted">Tu opinión se publica como “Paciente verificado”, sin tu nombre.</p>`,
    `<button class="btn btn-ghost grow" data-act="close">Cancelar</button><button class="btn btn-primary grow" data-act="publicarResena" ${s.estrellas?'':'disabled'}>Publicar opinión</button>`);
}
function portalBody(s){
  const d=docById(s.docId); const dias=proximosDias(7);
  let total=0, res=0;
  const blocks=dias.map(f=>{
    const hs=horasDe(d,f); if(!hs.length) return '';
    return `<div class="agenda-day"><h3>${esc(f===hoy()?'Hoy':cap(fmtLarga(f)))}</h3><div class="agenda-slots">${hs.map(h=>{
      total++; const o=S.ocupados.get(slotKey(d.id,f,h));
      if(o&&o.tipo==='bloqueo') return `<button class="aslot blk" data-act="desbloquear" data-v="${f}|${h}"><b class="num">${h}</b><span>Bloqueado</span></button>`;
      if(o){res++;return `<div class="aslot res"><b class="num">${h}</b><span>Reservada · ${o.modalidad==='Videoconsulta'?'Video':'Consultorio'}</span></div>`}
      return `<button class="aslot" data-act="bloquear" data-v="${f}|${h}"><b class="num">${h}</b><span class="muted">Disponible</span></button>`}).join('')}</div></div>`}).join('');
  const c=calif(d.id);
  return `<div class="note">${I.info}<span>Vista de demostración del lado del médico. Elige un profesional para ver su agenda en tiempo real: las reservas de los pacientes aparecen aquí al instante.</span></div>
    <div class="field"><label for="pt-doc">Profesional</label><select class="input" id="pt-doc">${DOCTORES.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${esc(x.nombre)} · ${esc(x.esp)}</option>`).join('')}</select></div>
    <div class="stats"><div class="card stat"><span class="small muted">Citas 7 días</span><b class="num">${res}</b></div><div class="card stat"><span class="small muted">Ocupación</span><b class="num">${total?Math.round(res/total*100):0}%</b></div><div class="card stat"><span class="small muted">Calificación</span><b class="num">${c?c.prom.toFixed(1):'—'}</b></div></div>
    <p class="small muted">Toca un horario disponible para bloquearlo (vacaciones, cirugía, comida). Toca uno bloqueado para liberarlo.</p>
    ${blocks}
    <p class="small muted">Por privacidad, en esta demo el médico solo ve horario y modalidad. En producción recibiría nombre y motivo del paciente a través de un expediente cifrado.</p>`;
}
function sheetPortal(s){return sheetFrame('Portal médico',portalBody(s),'')}

/* ============ Acciones ============ */
function toast(msg){const r=$('#toastRoot');r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2800)}
function nuevoFolio(){return 'HD'+Date.now().toString(36).toUpperCase().slice(-6)}

async function confirmarCita(){
  const s=S.sheet; const d=docById(s.id);
  s.paciente=$('#b-pac').value; s.motivo=$('#b-mot').value.trim();
  const m=document.querySelector('input[name="metodo"]:checked'); s.metodo=m?m.value:'consultorio';
  if(s.metodo==='membresia'&&!cupoRestante()&&!(s.reprogramar&&S.citas.find(c=>c.id===s.reprogramar)?.cubierta)){s.error='Ya no te quedan consultas incluidas este mes.';renderSheet();return}
  s.busy=true; s.error=''; renderSheet();
  const key=slotKey(d.id,s.fecha,s.hora);
  try{
    const ok=await ST.claim(key,{doctorId:d.id,fecha:s.fecha,hora:s.hora,modalidad:s.modo,tipo:'cita',creada:new Date().toISOString()});
    if(!ok){s.busy=false;s.paso='elegir';s.hora=null;renderSheet();toast('Alguien acaba de reservar ese horario. Elige otro.');return}
    if(s.reprogramar){
      const old=S.citas.find(c=>c.id===s.reprogramar);
      await ST.updateCita(old.id,{fecha:s.fecha,hora:s.hora,modalidad:s.modo,paciente:s.paciente,motivo:s.motivo,slot:key,cubierta:s.metodo==='membresia',precio:d.precio});
      if(old.slot&&old.slot!==key){try{await ST.release(old.slot)}catch(e){}}
      s.folio=old.folio;
    }else{
      s.folio=nuevoFolio();
      await ST.addCita({doctorId:d.id,fecha:s.fecha,hora:s.hora,modalidad:s.modo,paciente:s.paciente,motivo:s.motivo,estado:'confirmada',cubierta:s.metodo==='membresia',precio:d.precio,slot:key,folio:s.folio,creada:new Date().toISOString()});
    }
    s.busy=false; s.paso='listo'; renderSheet();
  }catch(e){s.busy=false;s.error='No se pudo confirmar la cita. Revisa tu conexión e inténtalo de nuevo.';renderSheet()}
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const a=t.dataset.act, v=t.dataset.v;
  if(a==='scrim'){if(e.target===t) closeSheet();return}
  switch(a){
    case 'tab': S.tab=v; S.confirmCancel=null; closeSheet(); render(); window.scrollTo(0,0); break;
    case 'esp': S.f.esp=v; document.querySelectorAll('[data-act="esp"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v)); $('#results').innerHTML=resultsHTML(); break;
    case 'limpiar': S.f={q:'',esp:'Todas',seguro:'',modo:'',orden:'recomendados'}; render(); break;
    case 'svtipo': S.sv.tipo=v; render(); break;
    case 'citastab': S.citasTab=v; S.confirmCancel=null; render(); break;
    case 'doctor': {const d=docById(v); const x=proxima(d); openSheet({type:'doctor',id:v,paso:'elegir',fecha:x?x.fecha:hoy(),hora:null,modo:d.modos[0],paciente:S.perfil.nombre,metodo:cupoRestante()?'membresia':'consultorio'}); break}
    case 'fecha': S.sheet.fecha=v; S.sheet.hora=null; document.querySelectorAll('.day').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v)); $('#slotBox').innerHTML=slotsHTML(docById(S.sheet.id),S.sheet); updDocFoot(); break;
    case 'hora': S.sheet.hora=v; document.querySelectorAll('.slot').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v)); updDocFoot(); break;
    case 'modo': S.sheet.modo=v; document.querySelectorAll('[data-act="modo"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v)); break;
    case 'continuar': if(S.sheet.hora){S.sheet.paso='confirmar';renderSheet();$('#sheetBody').scrollTop=0} break;
    case 'atrasDoc': S.sheet.paso='elegir'; renderSheet(); break;
    case 'confirmar': confirmarCita(); break;
    case 'verCitas': closeSheet(); S.tab='citas'; S.citasTab='proximas'; render(); window.scrollTo(0,0); break;
    case 'close': closeSheet(); break;
    case 'cancelar': S.confirmCancel=v; render(true); break;
    case 'cancelarNo': S.confirmCancel=null; render(true); break;
    case 'cancelarSi': {const c=S.citas.find(x=>x.id===v); S.confirmCancel=null; try{await ST.updateCita(v,{estado:'cancelada',canceladaEn:new Date().toISOString()}); if(c.slot) await ST.release(c.slot); toast('Cita cancelada. El horario quedó libre.')}catch(err){toast('No se pudo cancelar. Inténtalo de nuevo.')} break}
    case 'reprogramar': {const c=S.citas.find(x=>x.id===v); const d=docById(c.doctorId); openSheet({type:'doctor',id:d.id,paso:'elegir',fecha:c.fecha,hora:null,modo:c.modalidad,paciente:c.paciente,motivo:c.motivo,metodo:c.cubierta?'membresia':'consultorio',reprogramar:c.id}); break}
    case 'simular': {const c=S.citas.find(x=>x.id===v); try{await ST.updateCita(v,{estado:'completada'}); if(c.slot) await ST.release(c.slot); S.citasTab='historial'; render(); toast('Consulta marcada como atendida. Ya puedes calificarla.')}catch(err){toast('No se pudo actualizar.')} break}
    case 'opinar': openSheet({type:'opinar',citaId:v,estrellas:0,texto:''}); break;
    case 'estrella': S.sheet.texto=$('#r-txt').value; S.sheet.estrellas=Number(v); renderSheet(); break;
    case 'publicarResena': {const s=S.sheet; const c=S.citas.find(x=>x.id===s.citaId); try{await ST.addResena({doctorId:c.doctorId,citaId:c.id,estrellas:s.estrellas,texto:$('#r-txt').value.trim().slice(0,400),fecha:hoy()}); closeSheet(); toast('¡Gracias! Tu opinión ya está publicada.')}catch(err){toast('No se pudo publicar. Inténtalo de nuevo.')} break}
    case 'plan': openSheet({type:'plan',plan:v}); break;
    case 'activarPlan': {const P={...S.perfil}; const cambio=!!P.plan; P.plan=v; if(!P.socio)P.socio=socioNum(); if(!cambio)P.renovacion=sumarMes(new Date().toISOString()); if(!P.renovacion)P.renovacion=sumarMes(new Date().toISOString()); if(v==='individual')P.miembros=[]; try{await ST.savePerfil(P); closeSheet(); toast(cambio?'Plan actualizado.':'¡Membresía activada! Ya tienes tu credencial digital.')}catch(err){toast('No se pudo activar el plan.')} break}
    case 'cancelarPlan': {const P={...S.perfil,plan:null,miembros:[]}; try{await ST.savePerfil(P); toast('Membresía cancelada. Puedes volver a activarla cuando quieras.')}catch(err){toast('No se pudo cancelar.')} break}
    case 'addMiembro': openSheet({type:'miembro'}); break;
    case 'guardarMiembro': {const n=$('#m-nom').value.trim(), p=$('#m-par').value, ed=$('#m-edad').value.trim(); const er=$('#m-err');
      if(n.length<3){er.textContent='Escribe el nombre completo.';er.hidden=false;return}
      if(ed&&!/^\d{1,3}$/.test(ed)){er.textContent='La edad debe ser un número.';er.hidden=false;return}
      const P={...S.perfil,miembros:[...(S.perfil.miembros||[]),{nombre:n,parentesco:p,edad:ed}]}; try{await ST.savePerfil(P);closeSheet();toast(n+' se agregó a tu plan.')}catch(err){toast('No se pudo guardar.')} break}
    case 'quitarMiembro': {const P={...S.perfil,miembros:(S.perfil.miembros||[]).filter((_,i)=>i!==Number(v))}; try{await ST.savePerfil(P);toast('Miembro eliminado del plan.')}catch(err){} break}
    case 'editarPerfil': openSheet({type:'perfil'}); break;
    case 'guardarPerfil': {const n=$('#p-nom').value.trim(), tel=$('#p-tel').value.replace(/\D/g,''), m=$('#p-mail').value.trim(), er=$('#p-err');
      if(n.length<3){er.textContent='Escribe tu nombre completo.';er.hidden=false;return}
      if(tel&&tel.length!==10){er.textContent='El teléfono debe tener 10 dígitos.';er.hidden=false;return}
      if(m&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){er.textContent='Revisa el formato del correo.';er.hidden=false;return}
      try{await ST.savePerfil({...S.perfil,nombre:n,telefono:tel,email:m});closeSheet();toast('Datos guardados.')}catch(err){toast('No se pudo guardar.')} break}
    case 'seguros': openSheet({type:'seguros'}); break;
    case 'guardarSeguros': {const sel=[...document.querySelectorAll('input[name="seg"]:checked')].map(i=>i.value); try{await ST.savePerfil({...S.perfil,seguros:sel});closeSheet();toast('Seguros actualizados.')}catch(err){} break}
    case 'notif': openSheet({type:'notif'}); break;
    case 'guardarNotif': try{await ST.savePerfil({...S.perfil,notif:{recordatorios:$('#n-rec').checked,promos:$('#n-pro').checked}});closeSheet();toast('Preferencias guardadas.')}catch(err){} break;
    case 'aviso': e.preventDefault(); openSheet({type:'aviso'}); break;
    case 'borrar': openSheet({type:'borrar'}); break;
    case 'borrarSi': try{await ST.borrarTodo(); closeSheet(); S.tab='descubrir'; toast('Tus datos se eliminaron.')}catch(err){toast('No se pudieron eliminar todos los datos. Inténtalo de nuevo.')} break;
    case 'authModo': S.auth={modo:v,email:S.auth&&S.auth.email}; showAuth(); break;
    case 'logout': try{await S.sb.auth.signOut()}catch(err){toast('No se pudo cerrar sesión.')} break;
    case 'portal': openSheet({type:'portal',docId:DOCTORES[0].id}); break;
    case 'bloquear': case 'desbloquear': {const [f,h]=v.split('|'); const key=slotKey(S.sheet.docId,f,h);
      try{ if(a==='bloquear'){const ok=await ST.claim(key,{doctorId:S.sheet.docId,fecha:f,hora:h,tipo:'bloqueo',creada:new Date().toISOString()}); if(!ok) toast(S.store.modo==='supabase'?'Solo el médico vinculado a esta agenda puede bloquear horarios.':'Ese horario ya no está disponible.')} else await ST.release(key)}catch(err){toast('No se pudo actualizar la agenda.')} break}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.f.q=e.target.value;$('#results').innerHTML=resultsHTML()}
  if(e.target.id==='sq'){S.sv.q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#sq');i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}
  if(e.target.id==='b-mot'&&S.sheet) S.sheet.motivo=e.target.value;
  if(e.target.id==='r-txt'&&S.sheet) S.sheet.texto=e.target.value;
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='f-seguro'){S.f.seguro=e.target.value;$('#results').innerHTML=resultsHTML()}
  if(id==='f-modo'){S.f.modo=e.target.value;$('#results').innerHTML=resultsHTML()}
  if(id==='f-orden'){S.f.orden=e.target.value;$('#results').innerHTML=resultsHTML()}
  if(id==='b-pac'&&S.sheet) S.sheet.paciente=e.target.value;
  if(e.target.name==='metodo'&&S.sheet){S.sheet.metodo=e.target.value;const p=document.querySelector('.sheet-foot .price');if(p)p.textContent=e.target.value==='membresia'?'$0':money(docById(S.sheet.id).precio)}
  if(id==='pt-doc'&&S.sheet){S.sheet.docId=e.target.value;refreshSheetSlots()}
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='authForm'){e.preventDefault();submitAuth();return}
  if(e.target.id!=='onbForm') return; e.preventDefault();
  const n=$('#o-nombre').value.trim(), tel=$('#o-tel').value.replace(/\D/g,''), m=$('#o-mail').value.trim(), er=$('#o-err');
  const fail=msg=>{er.textContent=msg;er.hidden=false};
  if(n.length<3) return fail('Escribe tu nombre completo.');
  if(tel&&tel.length!==10) return fail('El teléfono debe tener 10 dígitos.');
  if(m&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) return fail('Revisa el formato del correo.');
  if(!$('#o-aviso').checked) return fail('Para continuar, acepta el aviso de privacidad.');
  try{await ST.savePerfil({nombre:n,telefono:tel,email:m,plan:null,socio:null,renovacion:null,miembros:[],seguros:[],notif:{recordatorios:true,promos:false},avisoAceptado:new Date().toISOString(),creado:new Date().toISOString()})}
  catch(err){fail('No se pudo crear tu perfil. Revisa tu conexión e inténtalo de nuevo.')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet) closeSheet()});

boot();
</script>
