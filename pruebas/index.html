.wordmark{font-family:var(--f-display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem;line-height:1.2}
h2{font-size:1.2rem;line-height:1.25}
h3{font-size:1rem;line-height:1.3}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}

.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-row{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .wordmark{white-space:nowrap;font-size:clamp(.74rem,3.4vw,.92rem)!important}
.btn svg{width:18px;height:18px;flex:none}
.top-row #cuentaBtn{min-height:34px;padding:6px 14px}
.demo-pill{margin-left:auto;font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
main{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--cols,6),1fr)}
.nav button{background:none;border:0;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:500;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--brand)}
.nav button[aria-current="page"] .nav-ic{background:var(--brand-soft)}
.nav-ic{display:grid;place-items:center;width:46px;height:28px;border-radius:999px;position:relative}
.badge-dot{position:absolute;top:0;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:.65rem;font-weight:700;display:grid;place-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px}
.card.elev{box-shadow:var(--shadow);border-color:transparent}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid transparent;padding:11px 16px;font-weight:600;font-size:.95rem;min-height:44px}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-soft{background:var(--brand-soft);color:var(--brand-ink)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:7px 12px;font-size:.86rem;border-radius:10px}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.85rem;font-weight:600}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 12px;min-height:44px}
.input::placeholder{color:var(--muted);opacity:1}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:38px}
.err{color:var(--danger);font-size:.85rem}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.86rem;font-weight:500;white-space:nowrap}
.chip-n{font-size:.72rem;opacity:.6;margin-left:2px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters select{flex:none;width:auto;font-size:.85rem;padding:8px 30px 8px 12px;min-height:38px;border-radius:999px;font-weight:500}
.filters select.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.ok{background:var(--brand-soft);color:var(--brand-ink)}
.tag.blue{background:var(--blue-soft);color:var(--blue)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.tag svg{width:13px;height:13px}

.quick-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick-acts button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;box-shadow:var(--shadow)}
.quick-acts b{font-size:.82rem;margin-top:6px;overflow-wrap:anywhere;line-height:1.25}
.quick-acts small{font-size:.74rem;color:var(--muted)}
.upsell{display:flex;gap:12px;align-items:center;border-radius:16px;padding:14px;background:var(--brand-soft);border:1px solid transparent;text-align:left;width:100%}
.upsell b{color:var(--brand-ink)}
.upsell svg{width:20px;height:20px;flex:none;color:var(--muted)}
.fpill{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:.85rem;font-weight:500;min-height:38px;white-space:nowrap}
.fpill[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.fpill svg{width:16px;height:16px}
.doc{position:relative}
.fav-btn{position:absolute;top:10px;right:10px;z-index:1;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.fav-btn.static{position:static;flex:none}
.fav-btn[aria-pressed="true"]{color:#E0475B;border-color:#F3C3CA}
.doc .doc-main{padding-right:34px}
.serv-list{display:flex;flex-direction:column;gap:8px}
.serv{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;cursor:pointer}
.serv input{accent-color:var(--brand);width:18px;height:18px;flex:none;margin:0}
.serv.on{border-color:var(--brand);background:var(--brand-soft)}
.serv .grow{flex:1;min-width:0}
.rev-sum{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rev-big{display:flex;flex-direction:column;align-items:center;gap:2px}
.rev-big b{font-family:var(--f-display);font-size:2rem;line-height:1}
.rev-bars{display:flex;flex-direction:column;gap:6px;min-width:0}
.rev-bar{display:grid;grid-template-columns:96px 1fr 28px;gap:8px;align-items:center}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cyan);border-radius:999px}
.reply{border-left:3px solid var(--brand);background:var(--surface-2);border-radius:0 10px 10px 0;padding:8px 10px;margin-top:4px;display:flex;flex-direction:column;gap:2px}
.cats{display:flex;flex-direction:column;gap:6px;padding:10px 14px}
.cat-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rate.sm button{font-size:1.5rem}
.cal-add{display:flex;flex-direction:column;gap:6px}
.avatar{position:relative;overflow:hidden}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avatar.xl{width:96px;height:96px;border-radius:28px;font-size:1.8rem}
.foto-ed{display:flex;gap:14px;align-items:center}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.redes-ed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:380px){.redes-ed{grid-template-columns:1fr}}
.sede{display:flex;gap:5px;align-items:flex-start;color:var(--ink);font-weight:500}
.sede svg{width:14px;height:14px;flex:none;margin-top:3px;color:var(--brand)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lnk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.86rem;font-weight:500;color:var(--ink);text-decoration:none;max-width:100%}
.lnk svg{width:16px;height:16px;color:var(--brand);flex:none}
.lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button{font-size:.66rem}
.nav-ic{width:40px}
.cover{--cc:#0B7D91;position:relative;flex:none;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;color:#fff;padding:12px 11px;display:flex;flex-direction:column;gap:4px;text-align:left;
  background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.22) 0 18%,transparent 19%),radial-gradient(circle at 0% 100%,rgba(255,255,255,.14) 0 30%,transparent 31%),linear-gradient(160deg,color-mix(in srgb,var(--cc) 75%,#fff) 0%,var(--cc) 55%,color-mix(in srgb,var(--cc) 70%,#000) 100%);box-shadow:0 6px 16px rgba(0,0,0,.14)}
.cover b{font-family:var(--f-display);font-size:1.02rem;line-height:1.15;margin-top:auto;text-wrap:balance}
.cover small{font-size:.7rem;opacity:.9;line-height:1.25}
.cover-tipo{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.9}
.cover-marca{display:flex;align-items:center;gap:4px;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-top:8px;opacity:.95}
.cover.lg{width:116px}.cover.lg b{font-size:.95rem}
.cover.mini{width:46px;border-radius:7px;padding:5px}.cover.mini b{font-size:.44rem}.cover.mini small,.cover.mini .cover-tipo,.cover.mini .cover-marca{display:none}
.eb-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.eb-card{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.eb-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.eb-info b{font-size:.92rem;line-height:1.25}
.eb-precio{margin-top:2px}
.pack-covers{display:flex;gap:8px}
.art{display:flex;align-items:center;gap:12px;text-align:left;width:100%;position:relative;overflow:hidden;padding-left:18px}
.art-bar{position:absolute;left:0;top:0;bottom:0;width:5px}
.indice{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;counter-reset:cap}
.indice li{counter-increment:cap;display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.indice li::before{content:counter(cap);width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:.72rem;font-weight:700;flex:none}
.indice li span:first-child{flex:1}
.indice li.lock{color:var(--muted)}.indice li svg{width:15px;height:15px;color:var(--muted)}
.lector{gap:14px;font-size:.95rem;line-height:1.65}
.lector article{display:flex;flex-direction:column;gap:8px}
.lector p,.lector ul,.lector ol{margin:0}
.lector ul,.lector ol{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.candado{position:relative;border-radius:14px;overflow:hidden}
.candado-blur{filter:blur(4px);opacity:.6;user-select:none;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.candado-cta{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:12px;background:linear-gradient(to bottom,transparent,var(--bg) 45%)}
.candado-cta svg{width:22px;height:22px;color:var(--brand)}
.candado{min-height:240px}
svg.chev{width:18px;height:18px;flex:none;color:var(--muted)}


.rol-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rol{position:relative;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;cursor:pointer;background:var(--surface)}
.rol input{position:absolute;opacity:0;pointer-events:none}
.rol b{font-size:.92rem}.rol small{font-size:.76rem;color:var(--muted)}
.rol.on{border-color:var(--brand);background:var(--brand-soft)}
.rol:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
.steps-info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps-info div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.74rem;color:var(--muted)}
.steps-info b{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:.8rem}
.chip-check{position:relative}
.chip-check input{position:absolute;opacity:0}
.chip-check span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.85rem;background:var(--surface);cursor:pointer}
.chip-check input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip-check input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.serv-ed{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.tabla{overflow-x:auto}
.tabla table{width:100%;border-collapse:collapse;font-size:.84rem}
.tabla th{text-align:left;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.tabla td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tabla .r{text-align:right}
.reglas{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trust div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.78rem;line-height:1.3;color:var(--muted)}
.trust svg{width:20px;height:20px;color:var(--brand)}
.trust b{color:var(--ink);font-weight:600;font-size:.82rem}

.avatar{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1rem;color:#fff}
.avatar.lg{width:72px;height:72px;border-radius:22px;font-size:1.4rem}
.avatar.sm{width:40px;height:40px;border-radius:12px;font-size:.85rem}
.doc{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.doc-hit{all:unset;display:flex;flex-direction:column;gap:12px;cursor:pointer;border-radius:10px}
.doc-hit:focus-visible{outline:2px solid var(--brand);outline-offset:4px}
.quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.qslot{border:1px solid var(--line);background:var(--brand-soft);color:var(--brand-ink);border-radius:10px;padding:6px 2px;font-weight:700;font-size:.88rem;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.qslot small{font-size:.66rem;font-weight:500;opacity:.85}
.qslot.more{background:var(--surface);color:var(--ink);font-weight:600;font-size:.8rem}
.qslot:hover{border-color:var(--brand)}
.doc-top{display:flex;gap:12px;align-items:flex-start}
.doc-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.doc-name{display:flex;align-items:center;gap:5px;font-weight:700;font-size:1rem}
.doc-name svg{width:16px;height:16px;color:var(--blue);flex:none}
.doc-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.84rem;color:var(--muted)}
.doc-foot{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.price{font-weight:700;font-size:1rem}
.stars{color:#E2A100;font-weight:700}
.next{font-size:.82rem;color:var(--brand-ink);font-weight:600}

.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg{width:44px;height:44px;color:var(--brand)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:62px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.day b{font-family:var(--f-display);font-size:1.15rem}
.day span{font-size:.72rem;color:var(--muted);text-transform:capitalize}
.day small{font-size:.66rem;color:var(--brand-ink);font-weight:600}
.day[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.day[aria-pressed="true"] span,.day[aria-pressed="true"] small{color:var(--on-brand)}
.day:disabled{opacity:.45}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 0;font-weight:600;font-size:.9rem}
.slot[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.slot:disabled{background:var(--surface-2);color:var(--muted);text-decoration:line-through;opacity:.7;cursor:not-allowed}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.9rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right;min-width:0}

.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:1.05rem;flex:1;min-width:0}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.sheet-body{overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:flex;flex-direction:column;gap:16px}
.sheet-foot{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.sheet-foot .grow{flex:1;min-width:0}

.cred{border-radius:20px;padding:18px;color:#F2FCFE;background:linear-gradient(135deg,#075B6A 0%,#0B7D91 55%,#2FB1C6 100%);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(7,91,106,.25)}
.cred .logo-wm{right:-30px;bottom:-40px;width:190px;opacity:.12}
.cred .label{color:rgba(242,252,254,.8)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px 18px;color:#F2FCFE;background:linear-gradient(140deg,var(--hero-a) 0%,var(--hero-b) 55%,var(--hero-c) 120%);display:flex;flex-direction:column;gap:14px}
.hero .logo-wm{right:-34px;top:-26px;width:170px;opacity:.13}
.hero p{color:rgba(242,252,254,.85)}
.hero h1{color:#fff;position:relative}
.hero .search .input{border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.auth-logo{display:flex;justify-content:center;padding-block:6px 2px}
.cred-name{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.cred-grid{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}
.cred canvas{width:76px;height:76px;background:#fff;border-radius:10px;padding:6px;flex:none}
.meter{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);border-radius:999px}

.plan{display:flex;flex-direction:column;gap:12px}
.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.plan li{display:flex;gap:8px;align-items:flex-start}
.plan li svg{width:16px;height:16px;color:var(--brand);flex:none;margin-top:3px}
.plan.current{border:2px solid var(--brand)}
.plan-price{font-family:var(--f-display);font-size:1.6rem;font-weight:700}
.plan-price small{font-family:var(--f-body);font-size:.85rem;font-weight:500;color:var(--muted)}

.list{display:flex;flex-direction:column}
.list > *{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.list > *:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list svg.chev{width:18px;height:18px;color:var(--muted)}
.li-ic{width:36px;height:36px;border-radius:11px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.li-ic svg{width:18px;height:18px}

.cita{display:flex;flex-direction:column;gap:12px}
.cita-when{display:flex;gap:12px;align-items:center}
.cal{flex:none;width:54px;border-radius:12px;overflow:hidden;text-align:center;border:1px solid var(--line)}
.cal span{display:block;background:var(--brand);color:var(--on-brand);font-size:.68rem;font-weight:700;text-transform:uppercase;padding:2px 0}
.cal b{display:block;font-family:var(--f-display);font-size:1.3rem;padding:3px 0;background:var(--surface)}
.confirm-box{background:var(--danger-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}

.toggle{position:relative;width:46px;height:28px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.toggle input:checked + span{background:var(--brand)}
.toggle input:checked + span::after{transform:translateX(18px)}
.toggle input:focus-visible + span{outline:2px solid var(--brand);outline-offset:2px}

.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--brand);width:18px;height:18px;flex:none}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt:has(input:disabled){opacity:.55;cursor:not-allowed}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps li{display:flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--muted);padding-top:8px;border-top:3px solid var(--line)}
.steps li span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;background:var(--surface-2)}
.steps li.now,.steps li.done{color:var(--brand-ink);border-color:var(--brand)}
.steps li.now span,.steps li.done span{background:var(--brand);color:var(--on-brand)}
.hero-ok{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0}
.hero-ok .ring{width:72px;height:72px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)}
.hero-ok svg{width:36px;height:36px}

.rate{display:flex;gap:6px}
.rate button{border:0;background:none;font-size:2rem;line-height:1;color:var(--line);padding:2px}
.rate button.on{color:#E2A100}
.review{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-bottom:1px solid var(--line)}
.review:last-child{border-bottom:0}

.agenda-day{display:flex;flex-direction:column;gap:8px}
.agenda-slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.aslot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:1px;font-size:.8rem}
.aslot b{font-size:.92rem}
.aslot.res{background:var(--brand-soft);border-color:transparent;color:var(--brand-ink);cursor:default}
.aslot.blk{background:var(--surface-2);color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.4rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.splash{min-height:70vh;display:grid;place-items:center;text-align:center}
.splash .logo-full{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.splash .logo-full{animation:none}}
.prose{display:flex;flex-direction:column;gap:10px;font-size:.92rem;max-width:65ch}
.prose h3{margin-top:6px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:12px;font-size:.86rem}
.note svg{width:18px;height:18px;color:var(--blue);flex:none;margin-top:2px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
@media (max-width:380px){.slots{grid-template-columns:repeat(3,minmax(0,1fr))}.trust{grid-template-columns:1fr}}

/* ===== Tablet (768 px o más): contenido más ancho, dos columnas, hojas como ventana centrada ===== */
@media (min-width:768px) and (min-height:560px){
  .app{max-width:980px}
  .top,main{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  main{gap:22px}
  h1{font-size:1.8rem}
  .hero{padding:28px 28px 24px}
  .hero h1{font-size:2rem;max-width:20ch}
  .hero .search{max-width:560px}
  .nav-in{max-width:980px}
  #results,#svres,.lista-citas,.planes,.art-grid,.pack-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  #results>p,#results>.empty,.lista-citas>.empty{grid-column:1/-1}
  .art-grid>*,.pack-grid>*{height:100%}
  .eb-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
  .quick-acts{grid-template-columns:repeat(3,minmax(0,1fr));max-width:720px}
  .trust{gap:12px}
  .angosto,#onb,#donb{width:100%;max-width:640px;margin-inline:auto}
  .sheet-wrap{align-items:center;padding:24px}
  .sheet{max-width:680px;border-radius:22px;max-height:calc(100vh - 48px)}
  .slots{grid-template-columns:repeat(6,minmax(0,1fr))}
  .agenda-slots{grid-template-columns:repeat(4,minmax(0,1fr))}
  .redes-ed{grid-template-columns:repeat(3,minmax(0,1fr))}
  .toast{top:calc(76px + env(safe-area-inset-top,0px))}
}
/* ===== Verificación del médico ===== */
.verif-paso{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.verif-barra{height:6px;border-radius:99px;background:var(--brand-soft);overflow:hidden}
.verif-barra span{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s ease}
/* ===== Piezas que solo se muestran en pantallas grandes (ocultas en celular) ===== */
.solo-pc,.hero-side,.hero-sub,.doc-cal,.pie{display:none}
.desc-layout,.filtros-lado,.pf,.pf-a,.pf-b,.pf-side,.perfil-grid{display:flex;flex-direction:column;min-width:0}
.desc-layout,.filtros-lado,.perfil-grid{gap:18px}
.pf,.pf-a,.pf-b{gap:16px}
@media (min-width:768px) and (min-height:560px){
  .hero-sub{display:block;max-width:52ch}
  .perfil-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
}
/* ===== Computadora (1100 px o más): menú arriba, filtros a la izquierda, perfil del médico en dos columnas ===== */
@media (min-width:1100px) and (hover:hover) and (pointer:fine){
  body{font-size:15.5px}
  .app{max-width:none}
  .top{padding:0 32px}
  .top-row{max-width:1280px;margin:0 auto;height:68px;gap:20px}
  .brand .wordmark{font-size:1rem!important}
  .nav{position:static;flex:1;align-self:stretch;background:none;border:0;padding:0}
  .nav-in{display:flex;justify-content:center;gap:2px;max-width:none;margin:0;height:100%}
  .nav button{flex-direction:row;gap:8px;height:100%;padding:0 12px;border-radius:0;border-bottom:3px solid transparent;font-size:.92rem;font-weight:500;color:var(--ink)}
  .nav button:hover{color:var(--brand)}
  .nav button[aria-current="page"]{color:var(--brand-ink);border-bottom-color:var(--brand);font-weight:600}
  .nav button svg{width:19px;height:19px}
  .nav-ic{width:auto;height:auto;background:none!important}
  .nav .badge-dot{top:-8px;right:-10px}
  .demo-pill{margin-left:0}
  .nav[hidden]+.demo-pill{margin-left:auto}
  main{padding:32px 32px 56px;align-items:center;gap:26px}
  main>*{width:100%;max-width:1280px}
  h1{font-size:2rem}
  h2{font-size:1.35rem}
  .toast{left:50%}

  /* Portada */
  .hero{padding:48px;border-radius:28px;gap:22px}
  .hero h1{font-size:2.6rem;max-width:18ch}
  .hero .search{max-width:640px}
  .hero .search .input{min-height:58px;font-size:1.05rem;padding-left:48px;border-radius:14px}
  .hero .search svg{left:17px;width:20px;height:20px}

const LS_KEY='hd-demo-v1';
function lsRead(){try{return JSON.parse(localStorage.getItem(LS_KEY)||'null')}catch(e){return null}}
function lsWrite(v){try{localStorage.setItem(LS_KEY,JSON.stringify(v))}catch(e){}}

function LocalStore(){
  const st = lsRead() || {perfil:null,citas:[],ocupados:{},resenas:[]};
  const subs={perfil:[],citas:[],ocupados:[],resenas:[]};
  const emit=k=>{lsWrite(st);const v=k==='ocupados'?Object.entries(st.ocupados).map(([id,d])=>({id,...d})):st[k];subs[k].forEach(f=>f(v))};
  const on=(k)=>cb=>{subs[k].push(cb);setTimeout(()=>emit(k),0)};
  return {
    modo:'local', uid:'local',
    onPerfil:on('perfil'), onCitas:on('citas'), onOcupados:on('ocupados'), onResenas:on('resenas'), onDoctores:cb=>setTimeout(()=>cb([]),0),
    async savePerfil(p){st.perfil=p;emit('perfil')},
    async addCita(c){const id=uid();st.citas.push({id,...c});emit('citas');return id},
    async updateCita(id,patch){st.citas=st.citas.map(c=>c.id===id?{...c,...patch}:c);emit('citas')},
    async claim(key,data){if(st.ocupados[key]) return false;st.ocupados[key]=data;emit('ocupados');return true},
    async release(key){delete st.ocupados[key];emit('ocupados')},
    async addResena(r){st.resenas.push({id:uid(),...r});emit('resenas')},
    async responder(id,texto){st.resenas=st.resenas.map(r=>r.id===id?{...r,respuesta:texto,respondida:new Date().toISOString()}:r);emit('resenas')},
    async borrarTodo(){for(const c of st.citas){if(c.estado==='confirmada'&&citaTime(c)>Date.now()) delete st.ocupados[c.slot]}st.perfil=null;st.citas=[];emit('ocupados');emit('citas');emit('perfil')}
  };
}
function CloudStore(db,me){
  const base=db.doc(`data/users/${me}/perfil`);
  const citas=base.collection('citas');
  const ocup=db.collection('ocupados');
  const res=db.collection('resenas');
  const fail=e=>toast(e&&e.code==='quota_exceeded'?'Se alcanzó el límite de almacenamiento de la demo.':'No se pudo sincronizar. Revisa tu conexión.');
  return {
    modo:'nube', uid:me,
    onPerfil:cb=>base.onSnapshot(s=>cb(s.exists?s.data():null),fail),
    onCitas:cb=>citas.onSnapshot(q=>cb(q.docs.map(d=>({id:d.id,...d.data()}))),fail),
    onOcupados:cb=>ocup.onSnapshot(q=>cb(q.docs.map(d=>({id:d.id,...d.data()})).filter(d=>d.doctorId)),fail),
    onResenas:cb=>res.onSnapshot(q=>cb(q.docs.map(d=>({id:d.id,...d.data()}))),fail),
    onDoctores:cb=>setTimeout(()=>cb([]),0),
    savePerfil:p=>base.set(p),
    async addCita(c){const r=await citas.add(c);return r.id},
    updateCita:(id,patch)=>citas.doc(id).update(patch),
    async claim(key,data){
      const ref=ocup.doc(key);
      const l=await ref.acquire({holder:me,ttlMs:4000});
      if(!l.acquired) return false;
      const s=await ref.get();
      if(s.exists&&s.data()&&s.data().doctorId) return false;
      await ref.set(data); return true;
    },
    release:key=>ocup.doc(key).delete(),
    async addResena(r){await res.add(r)},
    responder:(id,texto)=>res.doc(id).update({respuesta:texto,respondida:new Date().toISOString()}),
    async borrarTodo(){
      for(const c of S.citas){
        if(c.estado==='confirmada'&&citaTime(c)>Date.now()){try{await ocup.doc(c.slot).delete()}catch(e){}}
        try{await citas.doc(c.id).delete()}catch(e){}
      }
      await base.delete();
    }
  };
}

const toCamel = o=>{const r={};for(const k in o){r[k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase())]=o[k]}return r};
function SupabaseStore(sb,user){
  const me=user.id; const rol=(user.user_metadata&&user.user_metadata.rol)==='medico'?'medico':'paciente';

  // Si la base de datos aún no tiene una columna nueva, se reintenta sin ella en lugar de fallar.
  const safe=async(fn,payload)=>{let r=await fn(payload);let n=0;while(r.error&&r.error.code==='PGRST204'&&n++<6){const m=/the '([^']+)' column/.exec(r.error.message||'');if(!m)break;delete payload[m[1]];r=await fn(payload)}return r};
  const fetchers={
    perfil:async()=>{const d=chk(await sb.from('perfiles').select('*').eq('id',me).maybeSingle());if(!d) return null;const p=toCamel(d);delete p.id;return p},
    citas:async()=>chk(await sb.from('citas').select('*').eq('user_id',me)).map(toCamel),
    ocupados:async()=>(await leerOcupados(sb)).map(toCamel),
    resenas:async()=>{const pub=await leerResenas(sb);const {data}=await sb.rpc('mis_resenas');const mias=new Map((data||[]).map(r=>[r.id,r.cita_id]));return pub.map(r=>{const x=toCamel(r);if(mias.has(x.id))x.citaId=mias.get(x.id);return x})},
    doctores:async()=>(await leerDoctores(sb)).map(toCamel),
    midoc:async()=>{const {data,error}=await sb.rpc('mi_doctor');if(error){if(error.code==='PGRST202'||error.code==='42883')return null;throw error}return data&&data[0]?toCamel(data[0]):null},
    citasdoc:async()=>{const id=S.miDoc&&S.miDoc.id;if(!id)return [];return chk(await sb.from('citas').select('*').eq('doctor_id',id)).map(toCamel)}
  };
  const refetch=async k=>{try{const v=await fetchers[k]();L[k].forEach(f=>f(v))}catch(e){fail()}};
  const ch=sb.channel('hd-'+me)

async function leerDoctores(sb){
  const colsBase='id,nombre,especialidad,cedula,universidad,experiencia,zona,direccion,modos,seguros,idiomas,dias,horas,bio,servicios,padecimientos,color,verificado,suspendido,tarjeta_ok,foto_url,web,redes,hospital,consultorio';

const sinMovimiento=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const PIEZAS='.hero,.quick-acts>*,.section-head,#results>*,.card,.plan,.cita,.doc,.planes>*,.recom-list>*,section.stack>h3,.kv';
let obsRv=null;
function animaVista(raiz){
  if(!raiz||sinMovimiento()) return;
  const todas=[...raiz.querySelectorAll(PIEZAS)]; const set=new Set(todas);
  const piezas=todas.filter(el=>{let p=el.parentElement; while(p&&p!==raiz){if(set.has(p)) return false; p=p.parentElement} return el.offsetParent!==null});
  const alto=innerHeight; let i=0;
  if(!obsRv&&'IntersectionObserver' in window) obsRv=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const el=e.target; el.style.setProperty('--d','0ms'); el.classList.add('rv-in'); obsRv.unobserve(el)}}),{rootMargin:'0px 0px -24px 0px'});
  for(const el of piezas){
    const r=el.getBoundingClientRect(); el.classList.add('rv');
    if(r.top<alto){el.style.setProperty('--d',Math.min(i++,10)*55+'ms'); el.classList.add('rv-in')}
    else if(obsRv) obsRv.observe(el); else el.classList.add('rv-in');
    el.addEventListener('animationend',()=>{el.classList.remove('rv','rv-in'); el.style.removeProperty('--d')},{once:true});
  }
}

// Orientación por síntoma: sugiere la especialidad, no diagnostica.
const SINTOMAS=[
  [/asma|pulmon|bronquitis|me falta el aire al|tos cronica|epoc|apnea/,'Neumología'],
  [/rinon|renal|dialisis|calculos|piedras en el rinon/,'Nefrología'],

  [/artritis|articulacion|reuma|lupus|gota/,'Reumatología'],
  [/rehabilitacion|lesion|esguince|contractura|fisio/,'Fisioterapia'],
  [/adulto mayor|abuelo|abuela|demencia|alzheimer/,'Geriatría'],
  [/cancer|tumor|bolita|quimio/,'Oncología'],
  [/pecho|palpitacion|presion alta|hipertension|corazon|taquicardia|arritmia/,'Cardiología'],
  [/piel|acne|granos|mancha|lunar|roncha|comezon|caspa|caida del cabello|se me cae el cabello|unas|verruga/,'Dermatología'],
  [/bebe|nino|nina|mi hijo|mi hija|vacuna|pediatr|recien nacido/,'Pediatría'],
  [/embaraz|menstrua|regla|periodo|ovario|papanicolau|anticoncep|colico menstrual|vagin|menopausia/,'Ginecología'],
  [/diente|muela|encia|caries|dental|brackets|ortodonc|limpieza dental/,'Odontología'],
  [/ansiedad|depresi|triste|estres|insomnio|no duermo|panico|terapia|duelo|autoestima/,'Psicología'],
  [/bajar de peso|subir de peso|dieta|obesidad|nutrici|alimentacion|colesterol|triglicer/,'Nutrición'],
  [/gripa|gripe|tos|fiebre|garganta|resfriado|dolor de cabeza|cansancio|chequeo|estomago|diarrea|infeccion|diabetes|azucar|presion|mareo|vomito/,'Medicina General']
];
const URGENTE=/(dolor|duele|opresion|aprieta)\b.{0,30}\bpecho|falta de aire|me falta el aire|no puedo respirar|me desmaye|desmayo|convulsi|sangrado abundante|paralisis|cara chueca|no puedo hablar/;
const CRISIS=/suicid|quitarme la vida|quiero morir|hacerme dano|lastimarme/;
const sinAcentos=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function espPorSintoma(q){const t=sinAcentos(q).trim(); if(t.length<3) return []; return [...new Set(SINTOMAS.filter(([re])=>re.test(t)).map(([,e])=>e))]}
function avisoSintomas(){
  const t=sinAcentos(S.f.q); if(t.trim().length<3) return '';
  if(CRISIS.test(t)) return `<div class="alerta-urg" role="alert">${I.info}<span><b>No estás solo.</b> Si piensas en hacerte daño, llama ahora a la Línea de la Vida <a href="tel:8009112000"><b>800 911 2000</b></a> (gratis, 24 horas) o al <a href="tel:911"><b>911</b></a>.</span></div>`;
  if(URGENTE.test(t)) return `<div class="alerta-urg" role="alert">${I.info}<span><b>Si es intenso o empezó de golpe, no esperes una cita:</b> llama al <a href="tel:911"><b>911</b></a> o ve a urgencias.</span></div>`;
  const e=espPorSintoma(S.f.q).filter(x=>sinAcentos(x)!==t.trim());
  return e.length?`<div class="note">${I.info}<span>Por lo que escribiste te sugerimos <b>${e.map(esc).join(' o ')}</b>. Es una orientación, no un diagnóstico.</span></div>`:'';
}
// Recomendados: calificación (con peso por número de opiniones), verificación y disponibilidad cercana. Nadie puede pagar por subir aquí.
function reputacion(d){const c=calif(d.id); const base=3.8, k=5;
  let r=c?(c.prom*c.n+base*k)/(c.n+k):base;
  if(d.db&&d.verificado!==false) r+=.3; if(d.espOk) r+=.1; if(d.consejoOk) r+=.1;
  const x=proxima(d); if(x){const dias=(citaTime({fecha:x.fecha,hora:x.hora})-Date.now())/864e5; r+=Math.max(0,.4-dias*.05)} else r-=1;
  return r}
function filtrarDoctores(){
  const {q,esp,seguro,modo,orden,disp,precio,fav}=S.f; const t=q.trim().toLowerCase(); const favs=S.perfil.favoritos||[];
  const semana=proximosDias(7); const porSint=espPorSintoma(q);
  let r=allDocs().filter(d=>!d.oculto).filter(d=>(esp==='Todas'||d.esp===esp)&&(!seguro||d.seguros.includes(seguro))&&(!modo||d.modos.includes(modo))
    &&(!t||(d.nombre+' '+d.esp+' '+d.zona+' '+(d.hospital||'')+' '+d.pad.join(' ')+' '+d.servicios.map(x=>x.n).join(' ')).toLowerCase().includes(t)||porSint.includes(d.esp))
    &&(!precio||d.precio<=Number(precio))&&(!fav||favs.includes(d.id))
    &&(disp!=='hoy'||libresDe(d,hoy()).length>0)&&(disp!=='semana'||semana.some(f=>libresDe(d,f).length>0)));
  const p=d=>{const x=proxima(d);return x?citaTime({fecha:x.fecha,hora:x.hora}):Infinity};
  if(orden==='precio') r.sort((a,b)=>a.precio-b.precio);
  else if(orden==='distancia') r.sort((a,b)=>(a.km??99)-(b.km??99));
  else if(orden==='calificacion') r.sort((a,b)=>((calif(b.id)||{prom:0}).prom)-((calif(a.id)||{prom:0}).prom));
  else if(orden==='disponible') r.sort((a,b)=>p(a)-p(b));
  else {const R=new Map(r.map(d=>[d.id,reputacion(d)])); r.sort((a,b)=>R.get(b.id)-R.get(a.id))}
  return r;
}
function proximosLibres(doc,n){const out=[];for(const f of proximosDias(14)){for(const h of libresDe(doc,f)){out.push({fecha:f,hora:h});if(out.length>=n) return out}}return out}

function insigniasHTML(d){return (d.espOk?`<span class="tag blue">${I.verified} Especialidad verificada</span>`:'')+(d.consejoOk?`<span class="tag blue">${I.shield} Certificado por su consejo</span>`:'')+(d.consultorioOk?`<span class="tag blue">${I.pin} Consultorio verificado</span>`:'')}
function docCalHTML(d){
  const dias=proximosDias(14).map(f=>({f,h:libresDe(d,f)})).filter(x=>x.h.length).slice(0,3);
  if(!dias.length) return `<div class="doc-cal"><p class="small muted">Sin horarios en las próximas 2 semanas</p><button class="btn btn-soft btn-sm" data-act="doctor" data-v="${d.id}">Ver perfil</button></div>`;
  return `<div class="doc-cal" aria-label="Horarios disponibles"><div class="doc-cal-g">${dias.map(x=>{const dt=parseYmd(x.f);return `<div class="doc-cal-d"><span class="doc-cal-h"><b>${x.f===hoy()?'Hoy':relDia(x.f)==='Mañana'?'Mañana':cap(DIAS[dt.getDay()])}</b><small class="num">${dt.getDate()} ${MESES[dt.getMonth()]}</small></span>${x.h.slice(0,4).map(h=>`<button class="qslot num" data-act="rapido" data-v="${d.id}|${x.f}|${h}">${h}</button>`).join('')}${x.h.length>4?`<span class="small muted num">+${x.h.length-4} más</span>`:''}</div>`}).join('')}</div>
    <button class="link small" data-act="doctor" data-v="${d.id}">Ver todos los horarios</button></div>`;
}
function resultsHTML(){
  const r=filtrarDoctores(); const pre=avisoSintomas();
  if(!r.length&&S.f.esp&&S.f.esp!=='Todas'&&!allDocs().some(d=>!d.oculto&&d.esp===S.f.esp)) return pre+`<div class="card empty">${I.search}<h3>Muy pronto: ${esc(S.f.esp)}</h3><p class="muted small">Estamos sumando especialistas verificados en tu zona. Mientras tanto, un médico general puede orientarte y, si hace falta, canalizarte.</p><button class="btn btn-soft btn-sm" data-act="esp" data-v="Medicina General">Ver médicos generales</button></div>`;
  if(!r.length) return pre+`<div class="card empty">${I.search}<h3>No encontramos profesionales con esos filtros</h3><p class="muted small">${S.f.fav&&!(S.perfil.favoritos||[]).length?'Aún no guardas favoritos. Toca el corazón en la tarjeta de un médico.':'Prueba con otra especialidad, otro día o quita algún filtro.'}</p><button class="btn btn-soft btn-sm" data-act="limpiar">Quitar filtros</button></div>`;
  return pre+`<p class="muted small num">${r.length} ${r.length===1?'profesional disponible':'profesionales disponibles'}</p>`+r.map(docCard).join('');
}

const ESP_CORTO={'Medicina General':'General','Traumatología y Ortopedia':'Traumatología','Otorrinolaringología':'Otorrino','Gastroenterología':'Gastro','Endocrinología':'Endocrino','Medicina Interna':'Med. Interna'};
function espChip(e){const [c,ic]=ESP_IC[e]||ESP_IC['Medicina General'];
  return `<button class="chip esp-chip" style="--c:${c}" data-act="esp" data-v="${esc(e)}" aria-pressed="${S.f.esp===e}" aria-label="${esc(e)}"><span class="esp-ic"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ic}</svg></span><span>${esc(ESP_CORTO[e]||e)}</span></button>`}
const ESP_VISIBLES=8;
function espRowHTML(){
  const todas=especialidades(); let l;
  if(S.espTodas) l=todas; else {l=todas.slice(0,ESP_VISIBLES+1); if(S.f.esp&&!l.includes(S.f.esp)) l.splice(1,0,S.f.esp)}
  const mas=`<button class="chip esp-chip mas" data-act="espMas" aria-expanded="${!!S.espTodas}"><span class="esp-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">${S.espTodas?'<path d="M6 15l6-6 6 6"/>':'<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>'}</svg></span><span>${S.espTodas?'Ver menos':'Ver todas ('+(todas.length-1)+')'}</span></button>`;
  return `<div class="chips esp-row ${S.espTodas?'abierta':''}" id="espRow" role="group" aria-label="Especialidad">${l.map(espChip).join('')}${mas}</div>`}

function estadoDe(c){if(c.estado==='cancelada') return [c.canceladaPor==='medico'?'Cancelada por el médico':c.canceladaPor==='sistema'?'Liberada: faltó el anticipo':'Cancelada','danger']; if(c.asistenciaPaciente==='no_asistio') return ['No asististe','danger']; if(c.estado==='completada'||citaTime(c)<=Date.now()) return ['Completada','ok']; return ['Confirmada','ok']}

function drawQR(){
  const cv=$('#qr'); if(!cv) return; const ctx=cv.getContext('2d'); const n=21, s=64/n;
  let h=0; for(const ch of (S.perfil.socio||'HD')) h=(h*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};
  ctx.fillStyle='#fff';ctx.fillRect(0,0,64,64);ctx.fillStyle='#0B1311';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);if(f)continue;if(rnd()>.52)ctx.fillRect(x*s,y*s,s,s)}
  const finder=(fx,fy)=>{ctx.fillRect(fx*s,fy*s,7*s,7*s);ctx.fillStyle='#fff';ctx.fillRect((fx+1)*s,(fy+1)*s,5*s,5*s);ctx.fillStyle='#0B1311';ctx.fillRect((fx+2)*s,(fy+2)*s,3*s,3*s)};
  finder(0,0);finder(14,0);finder(0,14);
}

const inicioCita=c=>citaTime(c);
function estadoCom(c){const t=inicioCita(c),now=Date.now(),H=3600e3;
  if(c.estado==='cancelada') return ['sin_comision', c.canceladaPor==='medico'?'Cancelada por ti':'Cancelada por el paciente','tag'];
  if(now<t) return ['pendiente','Próxima','tag blue'];
  if(c.asistenciaMedico==='no_asistio'&&c.asistenciaPaciente==='asistio') return ['en_revision','En revisión','tag warn'];
  if(c.asistenciaMedico==='no_asistio') return ['no_asistio','No asistió','tag'];
  if(c.asistenciaMedico==='asistio') return ['cobrable','Atendida','tag ok'];
  if(c.asistenciaPaciente==='no_asistio') return ['no_asistio','No asistió','tag'];
  if(now>t+72*H) return ['cobrable','Atendida (automático)','tag ok'];
  return ['por_confirmar','Marca la asistencia','tag warn'];}

function toast(msg){const r=$('#toastRoot');r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2800)}
function calFechas(c){const [H,M]=c.hora.split(':').map(Number);const st=parseYmd(c.fecha);st.setHours(H,M,0,0);const en=new Date(st.getTime()+(c.min||30)*60000);
  const f=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;return [f(st),f(en)]}

function calendarioHTML(c){

}
function descargarICS(c){
  const [a,b]=calFechas(c); const t=calTexto(c); const x=s=>String(s).replace(/[\\,;]/g,m=>'\\'+m);
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Health Digital//Citas//ES','BEGIN:VEVENT','UID:'+(c.folio||uid())+'@healthdigital','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART;TZID=America/Mexico_City:'+a,'DTEND;TZID=America/Mexico_City:'+b,'SUMMARY:'+x(t.titulo),'DESCRIPTION:'+x(t.detalle),'LOCATION:'+x(t.lugar),'BEGIN:VALARM','TRIGGER:-PT2H','ACTION:DISPLAY','DESCRIPTION:Recordatorio de tu cita','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
  const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar'})); const el=document.createElement('a'); el.href=url; el.download='cita-health-digital.ics'; document.body.appendChild(el); el.click(); el.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}

  }

  try{

    if(!ok){s.busy=false;s.paso='elegir';s.hora=null;renderSheet();toast('Alguien acaba de reservar ese horario. Elige otro.');return}

  if(e.target.name==='metodo'&&S.sheet){S.sheet.metodo=e.target.value;const p=document.querySelector('.sheet-foot .price');if(p)p.textContent=e.target.value==='membresia'?'$0':money(servDe(docById(S.sheet.id),S.sheet.serv).p)}
  if(e.target.dataset&&e.target.dataset.doc){const f=e.target.files&&e.target.files[0]; const tipo=e.target.dataset.doc; e.target.value=''; if(!f) return;
    if(f.size>5*1024*1024){toast('El archivo pesa más de 5 MB.');return}
    if(!/^(application\/pdf|image\/(jpeg|png|webp))$/.test(f.type)){toast('Sube un PDF o una imagen JPG, PNG o WEBP.');return}
    toast('Subiendo…'); ST.subirDocumento(tipo,f).then(()=>{toast('Documento enviado. Lo revisamos y te avisamos.');S.verif=undefined;cargarVerif()}).catch(()=>toast('No se pudo subir. Inténtalo de nuevo.'))}
  if(id==='d-foto'){const f=e.target.files&&e.target.files[0]; if(!f) return; prepararFoto(f).then(r=>{S.foto=r;const pv=$('#fotoPrev');if(pv){pv.querySelector('img')?.remove();const im=document.createElement('img');im.src=r.preview;im.alt='Tu foto de perfil';pv.appendChild(im)}toast('Foto lista. Se guardará al guardar tu perfil.')}).catch(er=>toast(er.message)); e.target.value=''}
  if(e.target.name==='rol'){document.querySelectorAll('.rol').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));if(S.auth)S.auth.rol=e.target.value}
  if(e.target.name==='serv'&&S.sheet){S.sheet.serv=e.target.value;document.querySelectorAll('.serv').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));const pp=$('#docPrice');if(pp)pp.textContent=money(servDe(docById(S.sheet.id),S.sheet.serv).p)}
  if(id==='pt-doc'&&S.sheet){S.sheet.docId=e.target.value;refreshSheetSlots()}
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='authForm'){e.preventDefault();submitAuth();return}
  if(e.target.id==='donb-form'||e.target.id==='dForm'){e.preventDefault(); const nuevo=e.target.id==='donb-form'; const d=leerDocForm(nuevo); if(!d) return;
    const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='Guardando…';
    try{ if(S.foto&&S.foto.blob){try{d.fotoUrl=await ST.subirFoto(S.foto.blob)}catch(er){toast('No se pudo subir la foto. Se guardó lo demás.')}} else if(S.foto&&S.foto.quitar){d.fotoUrl=null;ST.borrarFoto()}
         S.foto=null;
         if(nuevo){await ST.saveDoctor({...d,id:slugDoc(d.nombre),terminosAceptados:new Date().toISOString(),color:['#0B7D91','#2E6DA4','#6B5B95','#2A6F7A','#5B7A3A','#9C4D7A'][Math.floor(Math.random()*6)]},true); window.scrollTo(0,0); toast('¡Perfil creado! Ahora registra tu tarjeta.')}
         else {await ST.saveDoctor({...d,id:S.miDoc.id},false); toast('Cambios guardados.')} }
    catch(err){const m=$('#d-err'); m.textContent=err&&err.code==='23505'?'Ya existe un perfil de médico con esta cuenta.':'No se pudo guardar. Revisa tus datos e inténtalo de nuevo.'; m.hidden=false}
    finally{btn.disabled=false; btn.textContent=nuevo?'Crear mi perfil de médico':'Guardar cambios'} return}
  if(e.target.id!=='onbForm') return; e.preventDefault();
  const n=$('#o-nombre').value.trim(), tel=$('#o-tel').value.replace(/\D/g,''), m=$('#o-mail').value.trim(), er=$('#o-err');
  const fail=msg=>{er.textContent=msg;er.hidden=false};
  if(n.length<3) return fail('Escribe tu nombre completo.');
  if(tel&&tel.length!==10) return fail('El teléfono debe tener 10 dígitos.');
  if(m&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) return fail('Revisa el formato del correo.');
  if(!$('#o-aviso').checked) return fail('Para continuar, acepta el aviso de privacidad.');
  window.scrollTo(0,0);
  try{await ST.savePerfil({nombre:n,telefono:tel,email:m,plan:null,socio:null,renovacion:null,miembros:[],seguros:[],notif:{recordatorios:true,promos:false},avisoAceptado:new Date().toISOString(),creado:new Date().toISOString()})}
  catch(err){fail('No se pudo crear tu perfil. Revisa tu conexión e inténtalo de nuevo.')}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.sheet){closeSheet();return}
  if(e.key==='Tab'&&S.sheet){const sh=document.querySelector('.sheet'); if(!sh) return;
    const f=[...sh.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
    if(!f.length) return; const a=f[0], z=f[f.length-1];
    if(!sh.contains(document.activeElement)){e.preventDefault();a.focus();return}
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()} else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});

boot();
</script>
